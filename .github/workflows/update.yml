name: update qso map

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 4 * * *"   # daily 04:40 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qso-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render map
        env:
          QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
          LOTW_USER: ${{ secrets.LOTW_USER }}
          LOTW_PASS: ${{ secrets.LOTW_PASS }} 
        run: |
          if [ -z "$QRZ_API_KEY" ] && [ -z "$LOTW_USER" ]; then
            echo "::warning::No QRZ_API_KEY / LOTW_USER secret configured - map update skipped."
            exit 0
          fi
          python ./generate.py --png --out . --name qso-map

      - name: Commit
        run: |
          if [ ! -f qso-map.svg ]; then
            echo "nothing generated - nothing to commit"
            exit 0
          fi
          git config user.name  "qso-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A qso-map.svg
          if [ -f qso-map.png ]; then git add qso-map.png; fi
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh QSO map"
            git push
          fi
