name: update qso map

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render map
        env:
          QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
          LOTW_USER: ${{ secrets.LOTW_USER }}
          LOTW_PASS: ${{ secrets.LOTW_PASS }}
        run: python generate.py --png --out . --name qso-map

      - name: Commit
        run: |
          git config user.name  "qso-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qso-map.svg qso-map.png
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh QSO map"
            git push
          fi
